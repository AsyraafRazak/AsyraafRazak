<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9ca3af"/>
    </linearGradient>
    <clipPath id="card"><rect x="80" y="60" width="1040" height="240" rx="28"/></clipPath>
    <style>
      .o1{animation:m1 14s ease-in-out infinite}
      .o2{animation:m2 18s ease-in-out infinite}
      .o3{animation:m3 16s ease-in-out infinite}
      @keyframes m1{0%,100%{transform:translate(0,0)}50%{transform:translate(260px,60px)}}
      @keyframes m2{0%,100%{transform:translate(0,0)}50%{transform:translate(-300px,-40px)}}
      @keyframes m3{0%,100%{transform:translate(0,0)}50%{transform:translate(120px,-70px)}}
      .sweep{animation:sw 6s ease-in-out infinite}
      @keyframes sw{0%{transform:translateX(-500px) skewX(-20deg)}60%,100%{transform:translateX(1400px) skewX(-20deg)}}
      .fade{opacity:0;animation:fi 1.2s ease-out forwards}
      .d1{animation-delay:.2s}.d2{animation-delay:.6s}.d3{animation-delay:1s}
      @keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
      .dot{animation:pulse 2s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
      text{font-family:'Segoe UI',-apple-system,Helvetica,Arial,sans-serif}
    </style>
  </defs>

  <rect width="1200" height="360" rx="24" fill="#050505"/>

  <!-- floating light orbs behind the glass -->
  <g filter="url(#blur)">
    <circle class="o1" cx="260" cy="120" r="140" fill="#6366f1" opacity="0.55"/>
    <circle class="o2" cx="940" cy="250" r="160" fill="#06b6d4" opacity="0.40"/>
    <circle class="o3" cx="640" cy="300" r="110" fill="#e5e7eb" opacity="0.22"/>
  </g>

  <!-- glass card -->
  <rect x="80" y="60" width="1040" height="240" rx="28" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.5"/>
  <g clip-path="url(#card)">
    <rect class="sweep" x="0" y="40" width="180" height="280" fill="url(#shine)"/>
  </g>


  <text class="fade d2" x="130" y="198" font-size="50" font-weight="700" fill="url(#text)">Muhammad Asyraaf bin Razak</text>
  <text class="fade d3" x="132" y="248" font-size="20" fill="#9ca3af" letter-spacing="0.5">Junior Software Engineer  ·  Web Developer @ TwoDazzle  ·  Malaysia</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
